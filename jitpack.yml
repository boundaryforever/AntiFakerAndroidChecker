# jitpack.yml

# 告诉 JitPack 使用 Android SDK 的哪个版本
jdk:
  - openjdk8

# 告诉 JitPack 安装 CMake 3.18.1
# before_install 脚本会在构建前执行
before_install:
  - curl -L -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
  - tar -zxvf cmake.tar.gz
  - export PATH=$PWD/cmake-3.18.1-Linux-x86_64/bin:$PATH